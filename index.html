<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="x5-orientation" content="portrait">
<meta name="x5-fullscreen" content="true">
<meta name="x5-page-mode" content="app">
<title>军事动态2026-04-03</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow-x:hidden}
body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,Microsoft YaHei,sans-serif}
.w{max-width:100%;margin:0 auto;padding:12px}
.hd{text-align:center;padding:12px 0 6px;border-bottom:1px solid #1e293b}
.tt{font-size:18px;font-weight:700;color:#3b82f6}
.dt{font-size:12px;color:#94a3b8;margin-top:2px}

/* 悬浮视频播放器 - 自适应全屏宽 */
.vw{position:sticky;top:0;z-index:100;background:#000;width:100%;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.6);margin-bottom:10px;transition:all 0.3s ease}
.vw video{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;background:#000}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(59,130,246,0.8);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;pointer-events:none;transition:all 0.2s}
.play svg{width:26px;height:26px;fill:#fff;margin-left:3px}

/* 迷你模式 - 滚动后缩小 */
.vw.mini{border-radius:8px;margin:0 8px;width:calc(100% - 16px)}
.vw.mini video{aspect-ratio:16/9;border-radius:8px}
.vw.mini .play{width:36px;height:36px}
.vw.mini .play svg{width:16px;height:16px}

/* 新闻列表 */
.s{background:#1e293b;border-radius:10px;padding:12px 14px;margin-bottom:8px;border-left:4px solid #3b82f6}
.t{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;background:#dc2626;color:#fff;margin-bottom:4px}
.h{font-size:15px;font-weight:600;color:#fff;margin-bottom:4px;line-height:1.4}
.c{font-size:13px;color:#94a3b8;line-height:1.6}
.ft{text-align:center;padding:12px 0;color:#475569;font-size:11px;border-top:1px solid #1e293b;margin-top:12px}
</style>
</head>
<body>
<div class="w">
<div class="hd"><div class="tt">全球军事动态</div><div class="dt">2026-04-03</div></div>
<div class="vw" id="vp">
<video id="v" playsinline webkit-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="true" x5-orientation="portraint" preload="auto" controls poster="https://cdn.jsdelivr.net/gh/zhengcls/military-news-1775187431/poster.webp">
<source src="https://cdn.jsdelivr.net/gh/zhengcls/military-news-1775187431/military_news_final.mp4" type="video/mp4">
</video>
<div class="play" id="p" onclick="play()">
<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
</div>
</div>
<div class="s"><span class="t">头条</span><div class="h">国际军事形势持续关注</div><div class="c">全球军事安全形势持续演变<br>多国加强军事部署与演习<br>地区安全格局面临调整<br>国际社会呼吁和平对话</div></div><div class="s"><span class="t">军事动态</span><div class="h">各国军事装备现代化进展</div><div class="c">多国推进军事装备现代化升级<br>新型武器系统持续研发测试<br>军事技术竞争日趋激烈<br>国防预算投入持续增长</div></div>
<div class="ft">全球军事动态日报 | 当日实时搜索</div>
</div>
<script>
var v=document.getElementById('v'),p=document.getElementById('p'),vp=document.getElementById('vp');
var isWX=/micromessenger/i.test(navigator.userAgent);
/* 微信浏览器静音自动播放，用户点击后取消静音 */
if(isWX){
  v.muted=true;
  v.play().then(function(){
    p.style.display='none';
    /* 微信首次点击取消静音 */
    function unmuteOnce(){
      v.muted=false;
      document.removeEventListener('click',unmuteOnce);
      document.removeEventListener('touchstart',unmuteOnce);
    }
    document.addEventListener('click',unmuteOnce);
    document.addEventListener('touchstart',unmuteOnce);
  }).catch(function(){});
}
function play(){v.muted=false;v.play().then(function(){p.style.display='none'}).catch(function(){})}
v.addEventListener('ended',function(){p.style.display='flex'});
v.addEventListener('pause',function(){p.style.display='flex'});
v.addEventListener('playing',function(){p.style.display='none'});
v.addEventListener('waiting',function(){vp.style.opacity='0.7'});
v.addEventListener('canplay',function(){vp.style.opacity='1'});

/* 滚动后视频自动切换迷你模式 */
var ticking=false;
window.addEventListener('scroll',function(){
  if(!ticking){
    requestAnimationFrame(function(){
      if(window.scrollY>200){
        vp.classList.add('mini');
      }else{
        vp.classList.remove('mini');
      }
      ticking=false;
    });
    ticking=true;
  }
});
</script>
</body>
</html>
